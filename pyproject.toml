[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tortoise-matrix"
version = "0.1.0"
description = "Slow-friendly Matrix chat client: every server-dependent operation is non-blocking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Tortoise Contributors" }]
keywords = ["matrix", "chat", "client", "optimistic-ui", "offline-first", "non-blocking", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/yuyu2929/tortoise-matrix"
Repository = "https://github.com/yuyu2929/tortoise-matrix"
Documentation = "https://github.com/yuyu2929/tortoise-matrix/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/yuyu2929/tortoise-matrix/issues"

[project.scripts]
tortoise-demo = "tortoise.demo:main"

[tool.setuptools.packages.find]
include = ["tortoise*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
